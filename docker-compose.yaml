version: "3.9"

services:
  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HTTP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - S3_ENDPOINT_URL=http://minio:9000
      - BACKEND_CORS_ORIGINS=http://localhost:${FRONTEND_HTTP_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend/app:/app/app  # hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Frontend ---
  frontend:
    image: node:20-alpine
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:3000"
    environment:
      # Browser on host must use the published backend port (same as BACKEND_HTTP_PORT in .env)
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_HTTP_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    # Remove npm rename temp dirs (.*-random) on overlay/volume — avoids ENOTEMPTY (any package, e.g. chokidar, fast-glob)
    command: sh -c "if [ -d node_modules ]; then find node_modules -mindepth 1 -maxdepth 1 -name '.*-*' -type d -exec rm -rf {} + 2>/dev/null; fi; npm install && npx next dev"

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Qdrant ---
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- MinIO (S3-compatible storage for videos/images) ---
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  qdrant_data:
  frontend_node_modules:
  minio_data:
