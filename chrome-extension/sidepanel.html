<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopilotRunner</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <!-- Bundled locally: CDN can be blocked; without libs markdown falls back to escaped plain text -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <span class="brand-name">Logistic Copilot</span>
          <span class="brand-sub">Agent</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeBtn" title="Toggle color theme" aria-label="Toggle color theme"></button>
        <details class="popover">
          <summary class="icon-btn" title="API settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </summary>
          <div class="popover-panel">
            <label class="field-label" for="apiBaseInput">Backend URL</label>
            <input type="url" id="apiBaseInput" class="field-input" placeholder="http://localhost:8000" />
            <button type="button" id="saveApiBtn" class="btn-primary">Save</button>
            <p class="field-hint">CORS: <code>CORS_ALLOW_CHROME_EXTENSIONS=true</code> or add <code>chrome-extension://…</code> to <code>BACKEND_CORS_ORIGINS</code>.</p>
          </div>
        </details>
        <button type="button" class="icon-btn" id="pageBtn" title="Insert active tab summary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </button>
        <button type="button" class="icon-btn danger" id="clearBtn" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="thread" id="messages" role="log" aria-live="polite">
      <article class="turn turn--assistant">
        <div class="assistant-flow">
          <div class="markdown-body welcome">
            <p>Connected to <strong>CopilotRunner</strong>. Tool calls appear <strong>inline</strong> where the model invoked them.</p>
          </div>
        </div>
        <time class="turn-meta">Now</time>
      </article>
    </main>

    <footer class="composer">
      <div class="composer-inner">
        <textarea
          id="userInput"
          placeholder="Message…"
          rows="1"
          maxlength="50000"
          aria-label="Message"
        ></textarea>
        <button type="button" id="sendBtn" class="send-fab" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none" opacity="0.9"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
