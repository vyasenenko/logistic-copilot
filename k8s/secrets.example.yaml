apiVersion: v1
kind: Secret
metadata:
  name: logistic-copilot-secrets
  namespace: logistic-copilot
type: Opaque
stringData:
  POSTGRES_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/DB"
  API_SECRET_KEY: "replace-with-random-secret"
  OUTLOOK_CREDENTIALS_FERNET_KEY: "replace-with-fernet-key"
  OUTLOOK_WEBHOOK_STATE_SECRET: "replace-with-random-secret"
  DEEPSEEK_API_KEY: "replace-with-deepseek-key"
  OPENAI_API_KEY: "replace-with-openai-key"
  ANTHROPIC_API_KEY: "replace-with-anthropic-key"
  TURNSTILE_SECRET_KEY: "replace-with-cloudflare-turnstile-secret"
  RESEND_API_KEY: "replace-with-resend-key"
