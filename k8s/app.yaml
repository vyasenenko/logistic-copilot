# Images are built and pushed by GitHub Actions (.github/workflows/docker-build.yml) to GHCR:
#   ghcr.io/vyasenenko/logistic-copilot-backend:TAG and ...-frontend:TAG
# Deploy a tag: TAG=v1.2.3 make k8s-set-image  (or run the "Deploy to Kubernetes" workflow).
# The GHCR packages are public, so no pull secret is needed. If you switch them to private,
# run `make k8s-ghcr-secret GHCR_USER=... GHCR_TOKEN=<PAT read:packages>` and add back to both
# pod specs:  imagePullSecrets: [{name: ghcr-creds}]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-agent
spec:
  replicas: 1
  # Single-node / tight CPU: avoid a second pod during rollout (default maxSurge needs spare CPU).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/vyasenenko/logistic-copilot-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-agent
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vyasenenko/logistic-copilot-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.logisticopilot.com"
            # Turnstile site key is inlined at Next.js build; set via Dockerfile --build-arg, not here.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-agent
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
