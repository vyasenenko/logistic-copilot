# Set image tags per release: issist/logistic-copilot-backend:TAG and issist/logistic-copilot-frontend:TAG
# Private Hub images: create secret in ai-agent, e.g. kubectl create secret docker-registry dockerhub-issist ...
# then reference it below (or change name to match your secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-agent
spec:
  replicas: 1
  # Single-node / tight CPU: avoid a second pod during rollout (default maxSurge needs spare CPU).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-issist
      containers:
        - name: backend
          image: issist/logistic-copilot-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-agent
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-issist
      containers:
        - name: frontend
          image: issist/logistic-copilot-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.logisticopilot.com"
            # Turnstile site key is inlined at Next.js build; set via Dockerfile --build-arg, not here.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-agent
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
